# Standing checks (issue #152, extended by #187).
#
# Two jobs, and the property they share is cost: the offline verification tier
# and eslint both run with no secrets, no Airtable, no Vercel Blob and no dev
# server, so either can run on every commit without touching the shared base or
# leaving fixtures behind.
#
# What is NOT here, and why:
#   - scripts/tests/verify-*.mjs — they need .env.local and write fixtures to
#     the one shared Airtable base. Running them per-commit would have several
#     workflows creating and deleting records in the same base at once. They
#     stay human-initiated.
#   - npm run build — `next build` loads lib/airtable/client.js, which throws
#     without AIRTABLE_API_KEY. It needs repository secrets configured first.

name: checks

on:
  push:
  pull_request:

# Issue #187. Every commit on a pull request branch starts TWO runs of this
# file — one for `push`, one for `pull_request` — and before this block a
# newer push did not stop the older one. During the GitHub Actions outage on
# 6 August that stacked up runs which could not be canceled. The `lint` job
# below doubled the bill for the same commit: four job runs where two would do.
#
# KEYED ON THE REF, WHICH KEEPS THE TWO LANES APART ON PURPOSE. `github.ref`
# is `refs/heads/<branch>` for the push run and `refs/pull/<n>/merge` for the
# pull_request one, so they land in different groups and never cancel each
# other. Collapsing them into one group would have a single commit's two runs
# cancel each other while both report under the same context name — and with
# `offline-checks` required on main, which status the ruleset ends up seeing
# would be a race. A required context reported as canceled blocks the merge.
#
# WHAT THIS DOES NOT DO: remove the duplicate. It cancels superseded runs
# within a lane; the push run and the pull_request run of one commit both
# still happen. Narrowing the `push` trigger is what would remove that, and
# it is deliberately not done here — see this commit's message.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main is never canceled: a run there is the record for a commit that is
  # already merged, and the next push must not erase it. Everywhere else a
  # superseded run is answering a question nobody is asking any more.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than left to the runner's default, so a change to that
      # default cannot break CI on its own — a failure that reads as an
      # environment problem is the kind people learn to ignore. Pinned to the
      # major: 20.x still floats, which is the intended tradeoff (security
      # patches without a version bump here).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --include=dev is explicit on purpose. It is npm ci's default, but the
      # offline tier parses source with acorn/acorn-jsx, which are
      # devDependencies, so the tier stops working entirely if anything ever
      # makes this a production install. Stating it beats relying on a default
      # nobody would think to check. If they are missing, run-all.mjs names the
      # cause rather than printing a module-resolution stack.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Offline verification tier
        run: npm test

  # Issue #187. eslint had exactly one error — InvoiceForm.js's
  # set-state-in-effect, present since #138 — and every issue since dismissed
  # it as "same as main". That is a baseline held in someone's memory: a second
  # error would be absorbed by the same sentence, and a clean run would prove
  # nothing. #187 fixed the error so this job can hold the baseline instead.
  #
  # A SEPARATE JOB RATHER THAN A STEP IN offline-checks. A lint failure
  # reported under the name "offline-checks" misattributes it to the
  # verification tier, and misattributed CI failures are what train people to
  # ignore CI. The tier is also a directory scan of scripts/tests/offline/ —
  # eslint is not in it, and folding it into that job would make the name claim
  # otherwise.
  #
  # WHAT THAT CHOICE COSTS, stated because it is easy to assume otherwise:
  # `offline-checks` is a required status check on main and `lint` is not. The
  # required list is a repository setting, not anything in this file, so until
  # `lint` is added there a red run here is visible on the pull request and
  # does not block the merge. Same coupling docs/notes/verification.md records
  # for renaming a job — the job key here is the name the setting must use.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # eslint is a devDependency, so the same reasoning as the tier above
      # applies: a production install would silently leave nothing to run.
      - name: Install dependencies
        run: npm ci --include=dev

      # `npx eslint .` rather than `npm run lint`, whose script is a bare
      # `eslint`. The two lint the identical set — eslint defaults its patterns
      # to "." — but the path is spelled out here so the log says what was
      # looked at, and so this line is what someone runs by hand to reproduce.
      - name: eslint
        run: npx eslint .
